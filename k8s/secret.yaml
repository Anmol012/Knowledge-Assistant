apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: knowledge-assistant
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  MYSQL_ROOT_PASSWORD: "password"
  # Optional Fernet key for encrypting provider API keys.
  # If empty, it is derived from JWT_SECRET.
  FERNET_KEY: ""