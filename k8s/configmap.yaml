apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: knowledge-assistant
data:
  DATABASE_URL: "mysql+pymysql://root:password@mysql:3306/ragdb?charset=utf8mb4"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "documents"
  EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  EMBEDDING_DIM: "384"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "200"
  TOP_K: "3"
  MEMORY_TURNS: "5"
  DEFAULT_PROVIDER: "ollama"
  OLLAMA_HOST: "ollama"
  OLLAMA_PORT: "11434"
  OLLAMA_MODEL: "gemma:2b"
  LLM_TEMPERATURE: "0.7"
  LLM_MAX_TOKENS: "500"
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_SIZE_MB: "50"